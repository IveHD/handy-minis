name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test -s "releases/${GITHUB_REF_NAME}.md"
      - name: Install Sparkle
        run: scripts/setup-sparkle.sh
      - name: Install Alibaba Cloud RUM SDK
        if: ${{ vars.ALIYUN_RUM_APP_ID != '' || vars.ALIYUN_RUM_CONFIG_ADDRESS != '' }}
        run: bash scripts/setup-aliyun-rum.sh
      - name: Build app
        env:
          APTABASE_APP_KEY: A-US-7430534959
          RELEASE_BUILD: 1
          UPDATE_FEED_URL: https://ivehd.github.io/handy-minis/appcast.xml
          SPARKLE_PUBLIC_KEY: Jygnoy6wAtb5QTOC+1BBl91WiJTKChB27SZZbppE8Hw=
          ALIYUN_RUM_APP_ID: ${{ vars.ALIYUN_RUM_APP_ID }}
          ALIYUN_RUM_CONFIG_ADDRESS: ${{ vars.ALIYUN_RUM_CONFIG_ADDRESS }}
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: scripts/package-dmg.sh
      - name: Verify release package
        run: |
          codesign --verify --deep --strict HandyMinis.app
          lipo HandyMinis.app/Contents/MacOS/HandyMinis -verify_arch x86_64 arm64
          hdiutil verify "dist/HandyMinis-${GITHUB_REF_NAME#v}-macOS-Universal.dmg"
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/HandyMinis-${GITHUB_REF_NAME#v}-macOS-Universal.dmg" dist/SHA256SUMS.txt --verify-tag --title "HandyMinis ${GITHUB_REF_NAME#v}" --notes-file "releases/${GITHUB_REF_NAME}.md"
