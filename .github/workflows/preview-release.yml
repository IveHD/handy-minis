name: Publish preview
on:
  push:
    tags:
      - 'v1.0.1-preview.1'
permissions:
  contents: write
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sparkle
        run: scripts/setup-sparkle.sh
      - name: Build preview
        env:
          APP_VERSION: 1.0.1-preview.1
          APP_BUILD: 2
          APTABASE_APP_KEY: A-US-7430534959
          RELEASE_BUILD: 1
        run: ./build.sh
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent ClipStack.app dist/ClipStack-1.0.1-preview.1.zip
          shasum -a 256 dist/*.zip > dist/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          全屏唤起与回贴测试版，适用于 macOS 14 及以上，支持 Apple 芯片和 Intel。

          此包使用临时签名，尚未经过 Apple 公证，macOS 可能阻止首次打开。
          自动更新地址尚未配置，已接入可关闭的匿名使用统计。本版本用于体验与验证。
          安装后通过菜单栏图标或 ⌘⇧C 打开剪贴板队列。
          NOTES
          gh release create v1.0.1-preview.1 dist/*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'ClipStack 1.0.1 Full Screen Preview' --notes-file /tmp/release-notes.md
